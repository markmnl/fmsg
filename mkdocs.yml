site_name: fmsg
site_url: https://fmsg.org/
site_description: The authoritative specification and standards for fmsg, an open distributed messaging protocol.
site_author: fmsg contributors
repo_name: markmnl/fmsg
repo_url: https://github.com/markmnl/fmsg
edit_uri: ""
copyright: Copyright &copy; fmsg contributors

docs_dir: .pages-source
site_dir: _site
use_directory_urls: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: pics/icon.png
  favicon: img/favicon.ico
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Specification:
      - Full specification: SPECIFICATION.md
      - Concise specification: SPEC.md
  - Standards:
      - Standards overview: STANDARDS.md
      - FMSG-001 — TCP+TLS: standards/fmsg-001-transport-and-binding.md
      - FMSG-002 — Address API: standards/fmsg-002-id.md
      - FMSG-003 — Web API: standards/fmsg-003-webapi.md
      - FMSG-004 — A2A binding: standards/fmsg-004-a2a-binding.md
  - White paper: white-paper.md
  - Implementations: IMPLEMENTATIONS.md
  - Background: show-hn.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - def_list
  - md_in_html
  - tables
  - smarty
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/scheme-images.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/markmnl/fmsg
      name: fmsg on GitHub

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn
